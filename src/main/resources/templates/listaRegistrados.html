<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="fragments :: head (titulo='Lista de Registrados')"></head>
<body>
<div class="container mt-5">
    <div th:replace="fragments :: navbar"></div>
    <h2 class="mb-4">Usuarios Registrados</h2>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Nombre</th>
            <th scope="col">Email</th>
            <th scope="col" class="text-center">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <!-- Recorre la lista 'usuarios' enviada desde el Controller -->
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}">1</td>
            <td th:text="${usuario.nombre}">Nombre Ejemplo</td>
            <td th:text="${usuario.email}">ejemplo@email.com</td>
            <td class="text-center">
                <!-- Botón que redirige a /registrados/{id} -->
                <a th:href="@{/registrados/{id}(id=${usuario.id})}"
                   class="btn btn-primary btn-sm">
                    Ver más detalles
                </a>
            </td>
        </tr>
        <!-- Mensaje opcional si la lista está vacía -->
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="4" class="text-center text-muted">No hay usuarios registrados.</td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="fragments :: javascript"></div>
</body>
</html>
